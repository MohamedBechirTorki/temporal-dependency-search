name: temporal-search-engine

services:
  mongodb:
    image: mongo:7.0
    # Single-node replica set: required for multi-document transactions
    # (atomic write of dependency versions + outbox events).
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "${MONGO_PORT:-27018}"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${MONGO_PORT:-27018}:${MONGO_PORT:-27018}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first start; idempotent afterwards.
      test: >
        mongosh --port ${MONGO_PORT:-27018} --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'${MONGO_RS_HOST:-localhost}:${MONGO_PORT:-27018}'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

  api:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      MONGO_URI: "mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true"
      NEO4J_URI: "bolt://neo4j:7687"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  mongo_data:
  neo4j_data:
